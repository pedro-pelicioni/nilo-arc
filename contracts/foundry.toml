# Built, tested and deployed with Arc Studio (https://studio.arc.io); same settings as its sandbox.
[profile.default]
src = "."
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc = "https://rpc.mainnet.arc.io"
